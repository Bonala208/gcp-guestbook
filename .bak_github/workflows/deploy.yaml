name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: pythonproject-502117
  GAR_LOCATION: asia-southeast1
  GKE_CLUSTER: guestbook-cluster
  GKE_ZONE: asia-southeast1-b
  REPOSITORY: guestbook-repo
  IMAGE: gcp-guestbook

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # DevSecOps Step: Free Open-Source Python SAST Scan (Bandit)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Run Bandit SAST Scanner
        run: |-
          pip install bandit
          bandit -r app.py -f txt || true

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Configure Docker authentication for Artifact Registry
      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 4. Build the Docker Image
      - name: Build Docker Image
        run: |-
          docker build \
            --platform linux/amd64 \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest" \
            .

      # 5. Push Docker Image to Artifact Registry
      - name: Push Docker Image
        run: |-
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

      # 6. Get GKE Credentials
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      # 7. Update Deployment Manifest & Deploy to GKE
      - name: Deploy to GKE
        run: |-
          sed -i "s|image: .*gcp-guestbook:.*|image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}|g" k8s-deployment.yaml
          kubectl apply -f k8s-deployment.yaml
          kubectl rollout status deployment/gke-guestbook -n guestbook-app
